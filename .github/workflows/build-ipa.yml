name: Build unsigned IPA

# Ручной запуск: вкладка Actions -> "Build unsigned IPA" -> Run workflow
on:
  workflow_dispatch:
    inputs:
      scheme:
        description: "Xcode scheme"
        default: "mobileLLM"
        required: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 150

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install tooling
        run: |
          brew install xcodegen || true
          brew list cmake >/dev/null 2>&1 || brew install cmake
          xcodebuild -version

      # Metal Toolchain нужен для MLX (в новых Xcode он ставится отдельно)
      - name: Metal toolchain
        run: xcodebuild -downloadComponent MetalToolchain || true

      # llama.xcframework (~355 MB) в репозитории не хранится, собирается 15-25 мин.
      # Кэшируем, чтобы последующие запуски были быстрыми.
      - name: Restore llama.xcframework cache
        id: llama-cache
        uses: actions/cache/restore@v4
        with:
          path: Packages/LLMEngineLlama/Vendor/llama.xcframework
          key: llama-xcframework-${{ hashFiles('scripts/build-llama-xcframework.sh') }}

      - name: Build llama.xcframework
        if: steps.llama-cache.outputs.cache-hit != 'true'
        run: |
          chmod +x scripts/build-llama-xcframework.sh
          ./scripts/build-llama-xcframework.sh

      - name: Save llama.xcframework cache
        if: steps.llama-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: Packages/LLMEngineLlama/Vendor/llama.xcframework
          key: llama-xcframework-${{ hashFiles('scripts/build-llama-xcframework.sh') }}

      - name: Signing.xcconfig (placeholder, подпись отключена)
        run: |
          [ -f Signing.xcconfig ] || cp Signing.xcconfig.example Signing.xcconfig

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Show schemes
        run: xcodebuild -list -project mobileLLM.xcodeproj

      # Патч: компилятор не справляется с огромной цепочкой строк через "+".
      # Разбиваем её на отдельные присваивания (поведение не меняется).
      - name: Patch AgentRuntimeAssembly.swift (split long string expression)
        run: |
          python3 - <<'PY'
          import re, sys
          path = "App/AgentRuntimeAssembly.swift"
          src = open(path, encoding="utf-8").read()
          pat = re.compile(
              r"        let instruction = CollaborativeWorkflow\.planningInstruction\n.*?\n(?=        // Dynamic execution uses the same frozen authority)",
              re.S)
          NEW = r'''        let toolIDsText: String = tools.joined(separator: ", ")
          let skillCatalogText: String = try CanonicalJSON(.array(availableSkills.map(\.catalogEntry))).string
          let allowedModelsText: String = source.modelPolicy.allowedSelections.map { $0.modelID.rawValue }.joined(separator: ", ")
          let reasoningText: String
          if source.modelPolicy.localOnly || !snapshot.onlineReasoningEnabled {
              reasoningText = "inherit only"
          } else {
              reasoningText = snapshot.onlineReasoningEffort?.rawValue ?? "service default"
          }
          let toolCallLimit: Int = executesCode ? 12 : 6
          let toolInvocationLimit = workflowBudget.limits[.toolInvocations]
          let modelAttemptLimit = workflowBudget.limits[.modelAttempts]
          var instruction: String = CollaborativeWorkflow.planningInstruction
          instruction += "\nWORKER TOOL IDS (host delegation remains available when this list is empty):\n"
          instruction += toolIDsText
          instruction += "\nACTUAL RUN DATE (UTC): "
          instruction += date
          instruction += "\nALLOWED SKILL CATALOG:\n"
          instruction += skillCatalogText
          instruction += "\nALLOWED MODELS: "
          instruction += allowedModelsText
          instruction += "\nMAXIMUM REASONING EFFORT: "
          instruction += reasoningText
          instruction += "\nFROZEN GOAL BUDGET: \(toolInvocationLimit) tool calls, \(modelAttemptLimit) model requests. Each activation may request at most \(toolCallLimit) tool calls. Reserve capacity for acceptance and final artifact delivery."
          instruction += "\nORIGINAL GOAL:\n"
          instruction += snapshot.text
          '''
          # YAML уже снял отступ блока; добавляем Swift-отступ в 8 пробелов (кроме первой строки)
          lines = NEW.split("\n")
          fixed = [lines[0]] + [("        " + l if l.strip() else l) for l in lines[1:]]
          NEW = "\n".join(fixed)
          new_src, n = pat.subn(lambda m: NEW, src, count=1)
          if n != 1:
              print("PATCH FAILED: pattern not found"); sys.exit(1)
          open(path, "w", encoding="utf-8").write(new_src)
          print("patched OK")
          PY
          sed -n '925,965p' App/AgentRuntimeAssembly.swift

      - name: Archive (unsigned, iOS)
        run: |
          set -o pipefail
          xcodebuild archive \
            -project mobileLLM.xcodeproj \
            -scheme "${{ inputs.scheme }}" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/mobileLLM.xcarchive" \
            -skipMacroValidation \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            OTHER_SWIFT_FLAGS='$(inherited) -Xfrontend -solver-expression-time-threshold=3600 -Xfrontend -solver-memory-threshold -Xfrontend 3500000000' \
            > "$RUNNER_TEMP/build.log" 2>&1

      - name: Show real errors
        if: failure()
        run: |
          echo "=== error lines ==="
          grep -nE "error:|fatal error|BUILD FAILED|ARCHIVE FAILED|Command .* failed|requires a minimum|Missing|not found" "$RUNNER_TEMP/build.log" | head -n 60 || true
          echo "=== last 60 lines ==="
          tail -n 60 "$RUNNER_TEMP/build.log"

      - name: Package IPA
        run: |
          APP=$(find "$RUNNER_TEMP/mobileLLM.xcarchive/Products/Applications" -maxdepth 1 -name "*.app" | head -n 1)
          echo "App: $APP"
          mkdir -p out/Payload
          cp -R "$APP" out/Payload/
          cd out
          zip -qry mobileLLM-unsigned.ipa Payload
          ls -lh mobileLLM-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: mobileLLM-unsigned-ipa
          path: out/mobileLLM-unsigned.ipa
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-log
          path: ${{ runner.temp }}/build.log
